<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 Multiverse Master Suite - Anime, Marvel & Pokémon Raid Wheel</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-master: #060911;
      --bg-bar: rgba(11, 16, 29, 0.95);
      --border-bar: rgba(255, 255, 255, 0.12);
      --accent-anime: #f59e0b;
      --accent-pokemon: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-master);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
    }

    /* MASTER NAVIGATION SWITCHER BAR */
    .master-switcher-bar {
      height: 58px;
      background: var(--bg-bar);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-bar);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
      flex-shrink: 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .master-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .brand-glow {
      background: linear-gradient(135deg, #f59e0b, #ec4899, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* GAME MODE TABS */
    .game-switcher-tabs {
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-bar);
      border-radius: 999px;
      padding: 4px;
      gap: 4px;
    }

    .switcher-tab-btn {
      padding: 7px 18px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .switcher-tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }

    .switcher-tab-btn.active-anime {
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #fff;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
    }

    .switcher-tab-btn.active-pokemon {
      background: linear-gradient(135deg, #dc2626, #ef4444);
      color: #fff;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
    }

    .master-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-portal-action {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-bar);
      background: rgba(30, 41, 59, 0.7);
      color: var(--text-main);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-portal-action:hover {
      background: rgba(51, 65, 85, 0.9);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    /* VIEWPORT FRAME CONTAINER */
    .master-viewports-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 58px);
      position: relative;
    }

    .game-frame {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      display: none;
      background: #000;
    }

    .game-frame.active-frame {
      display: block;
    }
  </style>
</head>
<body>

  <!-- TOP MASTER GAME SWITCHER BAR -->
  <header class="master-switcher-bar">
    <div class="master-brand">
      <span>🌌</span>
      <span class="brand-glow">MULTIVERSE MASTER SUITE</span>
    </div>

    <!-- SWITCHER TABS -->
    <nav class="game-switcher-tabs">
      <button id="tab-anime" class="switcher-tab-btn active-anime" type="button">
        <span>☠️</span> One Piece • Naruto • Marvel (150 Legends)
      </button>
      <button id="tab-pokemon" class="switcher-tab-btn" type="button">
        <span>🔴</span> Pokémon Raid Arena (60 Champions & Bosses)
      </button>
    </nav>

    <!-- ACTIONS -->
    <div class="master-actions">
      <a id="link-direct-game" href="anime-marvel/index.html" target="_blank" class="btn-portal-action" title="Open current game in dedicated fullscreen tab">
        <span>↗️</span> Fullscreen Tab
      </a>
      <button id="btn-fullscreen-toggle" class="btn-portal-action" type="button" title="Toggle Master Fullscreen">
        <span>⛶</span> Fullscreen
      </button>
    </div>
  </header>

  <!-- VIEWPORTS CONTAINER -->
  <main class="master-viewports-container">
    <!-- Game 1: One Piece, Naruto, Marvel -->
    <iframe id="frame-anime" class="game-frame active-frame" src="anime-marvel/index.html"></iframe>

    <!-- Game 2: Pokémon Raid Boss Battler -->
    <iframe id="frame-pokemon" class="game-frame" src="pokemon/index.html"></iframe>
  </main>

  <script>
    const tabAnime = document.getElementById('tab-anime');
    const tabPokemon = document.getElementById('tab-pokemon');
    const frameAnime = document.getElementById('frame-anime');
    const framePokemon = document.getElementById('frame-pokemon');
    const linkDirect = document.getElementById('link-direct-game');
    const btnFullscreen = document.getElementById('btn-fullscreen-toggle');

    function switchToAnime() {
      tabAnime.className = 'switcher-tab-btn active-anime';
      tabPokemon.className = 'switcher-tab-btn';
      frameAnime.className = 'game-frame active-frame';
      framePokemon.className = 'game-frame';
      linkDirect.href = 'anime-marvel/index.html';
    }

    function switchToPokemon() {
      tabPokemon.className = 'switcher-tab-btn active-pokemon';
      tabAnime.className = 'switcher-tab-btn';
      framePokemon.className = 'game-frame active-frame';
      frameAnime.className = 'game-frame';
      linkDirect.href = 'pokemon/index.html';
    }

    tabAnime.addEventListener('click', switchToAnime);
    tabPokemon.addEventListener('click', switchToPokemon);

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });
  </script>
</body>
</html>
